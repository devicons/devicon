name: Check Icon PR
on:
  pull_request:
    # edited: re-check when the PR title is fixed
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'icons/**'
      - 'devicon.json'
jobs:
  check:
    name: Check the `devicon.json` and the SVGs' quality
    runs-on: ubuntu-latest
    steps:
      # Checks out the PR's merge commit; depth 2 so HEAD^1 (the target branch)
      # is available to diff against
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if PR targets master
        if: ${{ github.base_ref != 'master' }}
        run: |
          echo "Error: This PR targets '${{ github.base_ref }}' but should target 'master'"
          echo "Please change the PR so that it's based on, and merged into 'master'"
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./.github/scripts/requirements.txt

      - name: Run the check_svg script
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python ./.github/scripts/check_icon_pr.py "$PR_TITLE" ./icons ./devicon.json

      - name: Upload the err messages
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: err_messages
          path: ./err_messages.txt

      - name: Save the pr num in an artifact
        shell: bash
        if: success()
        env:
          PR_NUM: ${{ github.event.number }}
        run: echo $PR_NUM > pr_num.txt

      - name: Upload the pr num
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pr_num
          path: ./pr_num.txt
