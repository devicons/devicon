name: Label Issue In Develop
on:
  workflow_run:
    workflows: ['On Develop PR Merge']
    types:
      - completed
jobs:
  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - run: echo "First workflow was a failure"
  label_preflight:
    name: Label Issue In Develop
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Python v3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ./.github/scripts/requirements.txt

      - name: Download workflow artifact
        uses: dawidd6/action-download-artifact@80620a5d27ce0ae443b965134db88467fc607b43 # v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: peek_icons.yml
          run_id: ${{ github.event.workflow_run.id }}

      - name: Read the pr_num file
        id: pr_num_reader
        uses: juliangruber/read-file-action@e0a316da496006ffd19142f0fd594a1783f3b512 # v1.0.0
        with:
          path: ./pr_num/pr_num.txt

      - name: Run in_develop_labeler.py
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.pr_num_reader.outputs.content }}
        run: python ./.github/scripts/in_develop_labeler.py $TOKEN "$PR_NUM"
