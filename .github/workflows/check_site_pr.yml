name: Check Website PR

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/check_site_pr.yml'

jobs:
  check:
    name: Typecheck & Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm --dir site install --frozen-lockfile

      - name: Svelte check
        run: pnpm --dir site check

      - name: Lint and format check
        run: pnpm --dir site lint

      - name: Build static site
        run: pnpm --dir site build
