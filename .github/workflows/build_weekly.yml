name: Weekly Build and Release
# Runs every Monday at 2 AM UTC, or manually via workflow_dispatch (same steps).
#
#   build   - (re)builds font glyphs for new/changed icons and the CSS, commits
#             them to master as "build: ...". Decides whether there's anything
#             to release.
#   release - waits for approval on the "production" environment, then bumps
#             the version, tags and creates the GitHub release.
#   publish - publishes the release to npm.

on:
  schedule:
    - cron: '0 2 * * 1'  # 2 AM UTC every Monday
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level (auto = derive from PR labels)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  issues: write
  pull-requests: read  # PR labels for the release check and notes

# Never run two builds/releases at once — they'd race on icomoon.json and tags
concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Fonts and CSS
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.release-check.outputs.should_release }}

    steps:
      # Token for pushing to master. See "Pushing to a protected master" below.
      - name: Get bot token
        id: bot-token
        if: vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          # Only what this workflow needs; fails here if the installation lacks it
          permission-contents: write

      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check for icon changes since last build
        id: check-changes
        run: |
          # Find the last commit whose message starts with "build:"
          SINCE=$(git log --format="%H %s" | awk '/^[a-f0-9]+ build:/ { print $1; exit }')

          if [ -z "$SINCE" ]; then
            echo "No previous build commit found - falling back to last release tag"
            SINCE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          fi
          if [ -z "$SINCE" ]; then
            echo "No release tag found either - checking all history"
            SINCE=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          echo "Building changes since $SINCE"
          echo "since=$SINCE" >> $GITHUB_OUTPUT

          if git diff --quiet "$SINCE" HEAD -- icons/ devicon.json; then
            echo "No icon changes since last build — skipping build"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_changes=true" >> $GITHUB_OUTPUT

          # Which icons need new glyphs? Pure JSON/git, so the runner's own
          # python3 can answer before the slow icomoon setup (pip, Firefox).
          # Changes that need no glyphs (tags, colours, aliases) only rebuild the
          # CSS; otherwise the "last build" marker wouldn't move and every later
          # run would install everything before finding nothing to build.
          COUNT=$(python3 -c 'import sys; sys.path.insert(0, ".github/scripts"); from icomoon_build_githubless import get_icons_for_building; print(len(get_icons_for_building("icomoon.json", "devicon.json", sys.argv[1], sys.stderr)))' "$SINCE")
          echo "$COUNT icons need new glyphs"
          echo "needs_glyphs=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Setup Python 3.12
        if: steps.check-changes.outputs.needs_glyphs == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Setup Node.js
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install Python dependencies
        if: steps.check-changes.outputs.needs_glyphs == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r ./.github/scripts/requirements.txt

      - name: Install Node dependencies
        if: steps.check-changes.outputs.has_changes == 'true'
        run: npm install

      - name: Install Firefox
        if: steps.check-changes.outputs.needs_glyphs == 'true'
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2

      - name: Make geckodriver executable
        if: steps.check-changes.outputs.needs_glyphs == 'true'
        run: chmod +x ./.github/scripts/build_assets/geckodriver-v0.32.2-linux64/geckodriver

      # Rebuilds icons whose glyphs don't match devicon.json (new icons, changed
      # font versions) or whose font SVGs changed since the last build. Exits
      # successfully without touching anything if there's nothing to build.
      # icomoon.io often fails for a while (timeouts, a slow page), so a failed
      # build is retried twice, a minute apart, from a clean tree. Each failed
      # attempt's log is kept as log-attempt-N.txt.
      - name: Run Icomoon build
        if: steps.check-changes.outputs.needs_glyphs == 'true'
        id: build
        continue-on-error: true
        env:
          SINCE: ${{ steps.check-changes.outputs.since }}
        run: |
          for attempt in 1 2 3; do
            if python ./.github/scripts/icomoon_build_githubless.py \
                ./.github/scripts/build_assets/geckodriver-v0.32.2-linux64/geckodriver \
                ./icomoon.json \
                ./devicon.json \
                ./icons \
                ./ \
                --headless \
                --since "$SINCE"; then
              exit 0
            fi
            echo "::warning::Icomoon build attempt $attempt of 3 failed"
            cp log.txt "log-attempt-$attempt.txt" || true
            [ "$attempt" = 3 ] && exit 1
            # Undo the failed attempt (optimized SVGs, icomoon.json, downloads).
            # Ignored files (node_modules, logs, screenshots) stay.
            git checkout -- .
            git clean -fdq
            sleep 60
          done

      # Always rebuilt when icons/devicon.json changed: aliases and colors in
      # devicon.json end up in devicon.min.css even when no glyphs change.
      - name: Build CSS
        if: steps.check-changes.outputs.has_changes == 'true' && steps.build.outcome != 'failure'
        id: build-css
        continue-on-error: true
        run: npm run build-css

      - name: Upload build log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.check-changes.outputs.needs_glyphs == 'true'
        with:
          name: build-log
          path: ./log*.txt

      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.check-changes.outputs.needs_glyphs == 'true'
        with:
          name: build-screenshots
          path: ./screenshots/
          if-no-files-found: ignore

      - name: Upload geckodriver log on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: geckodriver-log
          path: ./geckodriver.log

      # Opens a "build-failed" issue. Set the repository variable
      # BUILD_FAILURE_MENTION (e.g. "@devicons/devicon__maintain") to notify
      # maintainers in it.
      - name: Handle build failure
        if: steps.check-changes.outputs.has_changes == 'true' && (steps.build.outcome == 'failure' || steps.build-css.outcome == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GLYPHS_FAILED: ${{ steps.build.outcome == 'failure' }}
          MENTION: ${{ vars.BUILD_FAILURE_MENTION }}
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Ensure the build-failed label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'build-failed'
              });
            } catch (e) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'build-failed',
                color: 'd73a4a',
                description: 'Weekly build failed'
              });
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly build failed - ${today}`,
              body: `The weekly Icomoon build failed${process.env.GLYPHS_FAILED === 'true' ? ' 3 times in a row' : ''}.\n\n**Workflow run:** ${runUrl}\n\nPlease investigate and re-run manually once fixed using the \`workflow_dispatch\` trigger on \`build_weekly.yml\`.${process.env.MENTION ? `\n\ncc ${process.env.MENTION}` : ''}`,
              labels: ['build-failed']
            });

            core.setFailed('Weekly build failed - issue created');

      - name: Commit build artifacts
        if: steps.check-changes.outputs.has_changes == 'true' && steps.build.outcome != 'failure' && steps.build-css.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "build: generate font files and CSS"
            # master may have moved while the build ran
            git pull --rebase origin master
            git push origin HEAD:master
          else
            echo "No build artifacts changed"
          fi

      # Release when anything users get (via npm / jsDelivr) changed since the
      # last release tag (SVGs, devicon.json, CSS or fonts), when a PR merged
      # since then carries a "release: ..." label (e.g. a website or workflow
      # feature), or when a manual run picks a bump level. Decided here rather
      # than in the release job so weeks with nothing to ship don't ask for an
      # approval. Skipped (= no release) if the build failed.
      - name: Check for changes to release
        id: release-check
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          SHIPPED="icons devicon.json devicon.min.css devicon-base.css fonts"
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release tag — releasing"
            echo "should_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if ! git diff --quiet "$LAST_TAG" HEAD -- $SHIPPED; then
            echo "Changes to release since $LAST_TAG:"
            git diff --stat "$LAST_TAG" HEAD -- $SHIPPED | tail -1
            echo "should_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ -n "$MANUAL_BUMP" ] && [ "$MANUAL_BUMP" != "auto" ]; then
            echo "Manual run with bump '$MANUAL_BUMP' — releasing"
            echo "should_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # PR numbers from squash commit titles like "feat: foo (#123)"
          for PR in $(git log --format=%s "$LAST_TAG..HEAD" | grep -oE '\(#[0-9]+\)' | tr -d '(#)' | sort -u); do
            LABEL=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name | select(startswith("release: "))][0] // empty' 2>/dev/null || true)
            if [ -n "$LABEL" ]; then
              echo "PR #$PR is labelled '$LABEL' — releasing"
              echo "should_release=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "Nothing to release since $LAST_TAG"
          echo "should_release=false" >> $GITHUB_OUTPUT

  # ── Release gate ─────────────────────────────────────────────────────────────
  # This job requires a manual approval in the "production" GitHub Environment
  # before bumping the version and publishing the release.
  #
  # One-time setup (repo admin):
  #   Settings → Environments → New environment → name it "production"
  #   Add required reviewers (maintainers who should approve releases).
  #
  # ── Pushing to a protected master ────────────────────────────────────────────
  # The build and release jobs push commits/tags straight to master. When master
  # is protected, GITHUB_TOKEN can't do that, so both jobs use a token from a
  # GitHub App that is on the ruleset's bypass list:
  #   vars.BOT_APP_ID             - the App ID
  #   secrets.BOT_APP_PRIVATE_KEY - a private key generated for the app
  # The app only needs "Contents: Read and write". Without these set, the jobs
  # fall back to GITHUB_TOKEN (fine for an unprotected master).
  release:
    name: Bump Version and Release
    needs: build
    if: needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    environment: production
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Get bot token
        id: bot-token
        if: vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          # Only what this workflow needs; fails here if the installation lacks it
          permission-contents: write

      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Explicit ref so we get the build: commit pushed by the build job,
          # not the commit the workflow was triggered on
          ref: master
          token: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Find commits since last release
        id: range
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release tag — using full history"
            echo "range=HEAD" >> $GITHUB_OUTPUT
          else
            echo "Last release: $LAST_TAG"
            echo "range=${LAST_TAG}..HEAD" >> $GITHUB_OUTPUT
          fi

      # Collects the PRs merged since the last release (from the "(#123)" in
      # squash commit titles) and derives from them:
      # - the version bump: highest of the "release: major/minor" labels, else patch
      # - the release notes, in the same format as earlier devicon releases
      - name: Determine version bump and release notes
        id: version-bump
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const range = '${{ steps.range.outputs.range }}';
            const { execSync } = require('child_process');
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            let log = '';
            try {
              log = execSync(`git log --format="%s" ${range}`).toString().trim();
            } catch (e) {
              console.log('Could not get git log:', e.message);
            }

            // Extract PR numbers from squash commit messages like "new icon: foo (#123)".
            // git log lists newest first, so the notes do too.
            const prNumbers = [...new Set([...log.matchAll(/\(#(\d+)\)/g)].map(m => parseInt(m[1])))];
            console.log('PR numbers found in commits:', prNumbers);

            let bump = 'patch';
            const icons = [], features = [];

            for (const prNumber of prNumbers) {
              let pr;
              try {
                ({ data: pr } = await github.rest.pulls.get({ ...repo, pull_number: prNumber }));
              } catch (e) {
                console.log(`Could not fetch PR #${prNumber}:`, e.message);
                continue;
              }

              const labels = pr.labels.map(l => l.name);
              console.log(`PR #${prNumber} labels:`, labels);
              if (labels.includes('release: major')) {
                bump = 'major';
              } else if (labels.includes('release: minor') && bump !== 'major') {
                bump = 'minor';
              }

              // Credit everyone who made commits in the PR
              const commits = await github.paginate(github.rest.pulls.listCommits, { ...repo, pull_number: prNumber, per_page: 100 });
              const authors = [...new Set(commits.map(c => c.author ? c.author.login : c.commit.author.name))];
              const line = `- [${pr.title}](${pr.html_url}) by ${authors.map(a => '@' + a).join(', ')}.`;

              // Icon PR titles are enforced (and auto-fixed) by the check-bot
              (/^(new|update) icon:/i.test(pr.title) ? icons : features).push(line);
            }

            const manualBump = '${{ inputs.bump }}';
            if (manualBump && manualBump !== 'auto') {
              console.log('Manual bump override:', manualBump);
              bump = manualBump;
            }
            console.log('Final version bump:', bump);
            core.setOutput('bump', bump);

            const sections = [];
            if (icons.length) sections.push(` **${icons.length} New/Updated Icons**\n${icons.join('\n')}`);
            if (features.length) sections.push(` **${features.length} New Features/Fixes**\n${features.join('\n')}`);
            const notes = ['A huge thanks to all our maintainers and contributors for making this release possible!', ...sections].join('\n\n');
            console.log('Release notes:\n' + notes);
            core.setOutput('notes', notes);

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install Node dependencies
        run: npm install

      - name: Bump version
        id: bump
        run: |
          BUMP="${{ steps.version-bump.outputs.bump }}"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          npm version $BUMP -m "chore: bump version to %s"
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          git push --follow-tags

      # Deliberately uses GITHUB_TOKEN (github-script's default), not the bot
      # token: a release created with GITHUB_TOKEN doesn't trigger npm_publish.yml,
      # so the publish job below is the only thing that publishes to npm.
      - name: Create GitHub release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NOTES: ${{ steps.version-bump.outputs.notes }}
        with:
          script: |
            const version = '${{ steps.bump.outputs.version }}';
            const bump = '${{ steps.version-bump.outputs.bump }}';

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `Release v${version}`,
              body: process.env.NOTES,
              draft: false
            });

            console.log(`Released v${version} (${bump} bump).`);

  publish:
    name: Publish to npm
    needs: release
    # npm trusted publishing (OIDC): the called workflow needs an id-token
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/npm_publish.yml
    with:
      ref: v${{ needs.release.outputs.version }}
