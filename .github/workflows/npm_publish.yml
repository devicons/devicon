name: "Publish to npm"
on:
  # Releases created by hand in the GitHub UI
  release:
    types: [released]
  # Releases created by build_weekly.yml. Those use GITHUB_TOKEN, which doesn't
  # trigger other workflows, so build_weekly.yml calls this one directly.
  workflow_call:
    inputs:
      ref:
        description: 'Tag or branch to publish'
        required: true
        type: string
  # Allows re-running a failed publish by hand from the Actions tab
  workflow_dispatch:
permissions: {}
jobs:
  publish:
    environment: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for npm trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # inputs.ref is set when called from build_weekly.yml; release events check
          # out the release tag; manual runs use the branch or tag selected in the Actions tab.
          ref: ${{ inputs.ref || (github.event_name == 'release' && github.event.release.tag_name) || github.ref }}
          persist-credentials: false
      # Node 24 ships with npm 11.5.1 or later, which trusted publishing requires
      - name: Use Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # No dependencies are installed: the package has no build step, and skipping
      # them keeps third-party install scripts out of the job that can publish.
      # Authenticates through the trusted publisher configured on npmjs.com, so no token is needed.
      # Forks only do a dry run so they can't publish the real package.
      - run: npm publish ${{ github.repository != 'devicons/devicon' && '--dry-run' || '' }}
